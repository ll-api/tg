name: Update Telegram Bot API artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * *"

permissions:
  contents: write

concurrency:
  group: telegram-bot-api-artifacts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate API artifacts from official documentation
        run: python update.py

      - name: Read schema version and release date
        id: metadata
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime

          with open("api.json", encoding="utf-8") as stream:
              document = json.load(stream)

          release_date = datetime.strptime(
              document["release_date"], "%B %d, %Y"
          ).strftime("%-d %b, %Y")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"version={document['version']}\n")
              stream.write(f"latest_update={release_date}\n")
          PY

      - name: Validate JSON artifacts
        run: python update.py --check

      - name: Commit and push updated snapshots
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          LATEST_UPDATE: ${{ steps.metadata.outputs.latest_update }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api.json api.min.json
          if git diff --cached --quiet; then
            echo "No API snapshot changes; no commit is needed."
            exit 0
          fi
          git commit -m "Version: ${VERSION}" -m "Latest Update: ${LATEST_UPDATE}"
          git push origin HEAD:main
