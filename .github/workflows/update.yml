name: Update Telegram Bot API artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: telegram-bot-api-artifacts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate API artifacts from official documentation
        run: python update.py

      - name: Read schema version and release date
        id: metadata
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime

          with open("api.json", encoding="utf-8") as stream:
              document = json.load(stream)

          release_date = datetime.strptime(
              document["release_date"], "%B %d, %Y"
          ).strftime("%-d %b, %Y")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"version={document['version']}\n")
              stream.write(f"latest_update={release_date}\n")
          PY

      - name: Validate JSON artifacts
        run: python update.py --check

      - name: Open or update review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: |
            Version: ${{ steps.metadata.outputs.version }}
            Latest Update: ${{ steps.metadata.outputs.latest_update }}
          title: "${{ steps.metadata.outputs.version }} - ${{ steps.metadata.outputs.latest_update }}"
          body: |
            This PR was generated from the official Telegram Bot API documentation.

            Review `api.json` and `api.min.json` for method/type changes before merging. No third-party Telegram schema repository is used as an input.
          branch: automation/telegram-bot-api-artifacts
          delete-branch: true
